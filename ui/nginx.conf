server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  access_log off;
  error_log /dev/null crit;

  location /api/ {
    proxy_pass http://core:8080/;
    proxy_set_header Host $host;
  }

  location /inspect {
    proxy_pass http://inspector:8081/inspect;
    proxy_set_header Host $host;
    proxy_read_timeout 20s;
  }
}
