server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  access_log off;
  error_log /dev/null crit;

  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self';";
  add_header Referrer-Policy "no-referrer";
  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "DENY";

  location /api/ {
    proxy_pass http://core:8080/;
    proxy_set_header Host $host;
  }

  location /inspect {
    proxy_pass http://inspector:8081/inspect;
    proxy_set_header Host $host;
    proxy_read_timeout 20s;
  }

  location = /health {
    default_type application/json;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self';";
    add_header Referrer-Policy "no-referrer";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    return 200 '{"status":"ok","tor_proxy":true,"memory_limit_mb":256}';
  }
}
