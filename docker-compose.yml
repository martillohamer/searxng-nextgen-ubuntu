services:
  core:
    image: searxng/searxng:latest
    container_name: searvga_core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    volumes:
      - ./searx:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8889/
    tmpfs:
      - /tmp:size=128M,noexec,nosuid,nodev
      - /var/log:size=64M,noexec,nosuid,nodev
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    depends_on:
      - tor

  tor:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: searvga_tor
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
      - /var/lib/tor:size=32M,uid=100,gid=101,mode=0700,noexec,nosuid,nodev
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - MAX_CIRCUIT_DIRTINESS=180
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9150"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "none"

  ui:
    image: nginx:alpine
    container_name: searvga_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8890:80"
    volumes:
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /run:size=16M,noexec,nosuid,nodev
      - /var/cache/nginx:size=64M,uid=101,gid=101,mode=1777,noexec,nosuid,nodev
      - /var/log/nginx:size=32M,noexec,nosuid,nodev
    read_only: true
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    depends_on:
      - core
  inspector:
    build:
      context: .
      dockerfile: Dockerfile.inspector
    image: searvga-inspector:local
    container_name: searvga_inspector
    restart: unless-stopped
    working_dir: /tmp
    environment:
      - TOR_PROXY=socks5h://searvga_tor:9150
      - PIP_NO_CACHE_DIR=1
      - LLM_BASE_URL=http://host.docker.internal:3001/v1
      - LLM_MODEL=auto
      - LLM_TIMEOUT_S=35
      - LLM_API_KEY=${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./searvga_inspector.py:/tmp/searvga_inspector.py:ro
    tmpfs:
      - /tmp:size=128M,noexec,nosuid,nodev
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: "none"
    depends_on:
      - tor
